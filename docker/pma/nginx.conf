# php2shell lab: the front-end in front of the untouched phpMyAdmin image.
#
# This is the only config the third victim gets, and it does not touch the
# victim: it runs as a sidecar that shares the phpMyAdmin container's network
# namespace (`--network container:p2s-pma`), so php-fpm is reached on
# 127.0.0.1:9000 exactly as the image ships it.
#
# client_max_body_size 2m is not a favour to the chain: the image already sets
# UPLOAD_LIMIT=2048K, so its own upload limit asks the front-end for this much
# room.  The chain's biggest request is 2,003,799 bytes.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log info;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path /tmp/ngx-body;
    fastcgi_temp_path /tmp/ngx-fcgi;
    proxy_temp_path /tmp/ngx-proxy;
    client_max_body_size 2m;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html;
        index index.php;

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html;
        }
    }
}
